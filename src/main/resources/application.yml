
spring:
  application:
    name: studentstay-backend

  datasource:
    url: ${DB_URL:jdbc:h2:file:./studentstay;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
    open-in-view: false

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:test-secret-key-that-is-long-enough-for-jwt-signing}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://24eg110b48-student-stay.vercel.app}
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:admin@studentstay.local}
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

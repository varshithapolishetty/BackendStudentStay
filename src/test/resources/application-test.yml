spring:
  datasource:
    url: jdbc:h2:mem:studentstay;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

jwt:
  secret: test-secret-key-that-is-long-enough-for-jwt-signing
  expiration-ms: 86400000

app:
  cors:
    allowed-origins: http://localhost:5173
  bootstrap:
    admin:
      email: admin@studentstay.local
      password: admin123

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
